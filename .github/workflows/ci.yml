name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install (CPU-only PyTorch, from uv.lock)
        run: uv sync --locked --extra cpu
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build and install the wheel outside the repository
        run: |
          uv build --wheel -o /tmp/dist
          uv venv /tmp/venv
          VIRTUAL_ENV=/tmp/venv uv pip install /tmp/dist/*.whl --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
      - name: Run the commands from another folder
        working-directory: /tmp
        run: |
          mkdir -p data/sub-001/ses-1 annotations
          echo '[{"P1": [0, 0, 0], "P2": [2, 0, 0]}]' > annotations/sub-001_ses-1.json
          /tmp/venv/bin/deepanedet-train --help
          /tmp/venv/bin/deepanedet-convert-annotations annotations_dir=annotations data_dir=data
          test -f data/sub-001/ses-1/aneurysms.csv
