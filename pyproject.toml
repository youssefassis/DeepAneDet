# Test and lint settings. The code is the deepanedet package, imported from the repository root.
# Run with: pip install -r requirements-dev.txt && pytest && ruff check .

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["baselines"]

[tool.ruff.lint]
# syntax errors and undefined names
select = ["E9", "F63", "F7", "F82"]
