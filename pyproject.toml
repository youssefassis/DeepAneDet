# Test and lint settings for the current layout (modules are imported from the three source folders).
# Run with: pip install -r requirements-dev.txt && pytest && ruff check .

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["dataStrategy", "models", "resources", "resources/scripts"]

[tool.ruff]
line-length = 120
extend-exclude = ["resources/Baselines"]

[tool.ruff.lint]
# syntax errors and undefined names
select = ["E9", "F63", "F7", "F82"]
